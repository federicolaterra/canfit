# canfit seed catalog of common apps (spec §9 source 3, §16; ADR-021).
#
# canfit uses these values only for apps it has no settings for and has never seen on this
# machine, and always labels them "estimate from catalog" with low confidence. As soon as the
# monitor has watched the app, canfit's own measurements win.
#
# Provenance: rounded starting values chosen by canfit's maintainers in November 2026 for a
# moderate workload (a browser with about a dozen tabs, a chat app in a few workspaces, an editor
# with one project open), as the memory of the app's whole process group: physical footprint on
# macOS, private working set on Windows, proportional set size on Linux. They are not
# measurements of any particular machine. Contributions replace them with measured values; see
# docs/open-source/apps.md ("The seed catalog").
#
# Fields of each [[app]]:
#   name         display name; unique (ignoring case) across names and aliases
#   aliases      other names people type
#   os           OSes the app runs on (macos, windows, linux); omit for all three
#   category     browser, chat, meeting, music, video, editor, ide, design, office, notes, mail,
#                ai, game, other
#   typical_mb   typical use of the whole app, in MiB
#   need_mb      what canfit checks: a busy but normal session, in MiB (>= typical_mb)
#   processes    app group or process names that identify the running app (.exe / .app optional)
#   source       where the numbers come from

schema_version = 1
reviewed = "2026-11-10"

