# canfit app profiles (ADR-020). One [[app]] block per app; first matching name wins.
#
#   name      the name canfit shows; also matched, ignoring case
#   aliases   other names people type
#   os        the OSes the app runs on (default: all three)
#   readers   ordered config readers; the first that reads a value wins. Kinds:
#             docker_desktop, utm, parallels, vmware, virtualbox, jetbrains, jvm_options, json
#   macos / windows / linux
#             how to find the running app: `bundles` (macOS .app names), `names` (process or app
#             group names, `.exe` optional), `shared` (shared processes that may hold the app's
#             memory but can't be attributed to it; only noted)
#
# Paths in readers use {home}, {config} (per-user settings folder) and {data} (per-user data
# folder), with "/" as separator on every OS. See docs/open-source/apps.md to add a profile.

schema_version = 1

# --- Containers --------------------------------------------------------------------------------

[[app]]
name = "Docker Desktop"
aliases = ["Docker", "Docker for Mac", "Docker for Windows"]
readers = [{ kind = "docker_desktop" }]
macos = { bundles = ["Docker"], shared = ["com.apple.Virtualization.VirtualMachine"] }
windows = { names = ["Docker Desktop", "com.docker.backend", "vmmemWSL", "vmmem"] }
linux = { names = ["docker-desktop", "com.docker.backend"] }

# --- Virtual machines --------------------------------------------------------------------------

[[app]]
name = "UTM"
os = ["macos"]
readers = [{ kind = "utm" }]
macos = { bundles = ["UTM"], shared = ["com.apple.Virtualization.VirtualMachine"] }

[[app]]
name = "Parallels Desktop"
aliases = ["Parallels"]
os = ["macos"]
readers = [{ kind = "parallels" }]
macos = { bundles = ["Parallels Desktop"], names = ["prl_vm_app", "prl_client_app"] }

[[app]]
name = "VMware Fusion"
aliases = ["VMware", "Fusion"]
os = ["macos"]
readers = [{ kind = "vmware" }]
macos = { bundles = ["VMware Fusion"], names = ["vmware-vmx"] }

[[app]]
name = "VMware Workstation"
aliases = ["VMware", "VMware Workstation Pro", "VMware Player"]
os = ["windows", "linux"]
readers = [{ kind = "vmware" }]
windows = { names = ["vmware", "vmware-vmx", "vmplayer"] }
linux = { names = ["vmware", "vmware-vmx", "vmplayer"] }

[[app]]
name = "VirtualBox"
aliases = ["Oracle VirtualBox", "VBox"]
readers = [{ kind = "virtualbox" }]
macos = { bundles = ["VirtualBox", "VirtualBoxVM"], names = ["VBoxHeadless", "VBoxSVC"] }
windows = { names = ["VirtualBox", "VirtualBoxVM", "VBoxHeadless", "VBoxSVC"] }
linux = { names = ["VirtualBox", "VirtualBoxVM", "VBoxHeadless", "VBoxSVC"] }

