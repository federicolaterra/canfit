name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rustflags: -D warnings
          # RUSTFLAGS replaces .cargo/config.toml, so the static C runtime is repeated here.
          - os: windows-latest
            rustflags: -D warnings -C target-feature=+crt-static
          - os: ubuntu-latest
            rustflags: -D warnings
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v5

      # rustup reads rust-toolchain.toml and installs the pinned toolchain with rustfmt and clippy.
      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Same gates as `make check`, invoked directly so Windows needs no make.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features --locked

      # Formula/canfit.rb and packaging/scoop/canfit.json must be what packaging/release.env
      # renders to (tests/packaging.rs checks the same on every OS without a shell).
      - name: Package manifests are rendered
        if: runner.os != 'Windows'
        run: sh packaging/render.sh --check

      # Windows: the release binary must not need the Visual C++ runtime, and must answer.
      - name: Release build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --locked

      - name: No Visual C++ runtime dependency (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $deps = & $dumpbin /nologo /dependents target\release\canfit.exe | Out-String
          Write-Output $deps
          if ($deps -match '(?i)vcruntime|msvcp|api-ms-win-crt') { throw "canfit.exe depends on the Visual C++ runtime" }

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $doc = target\release\canfit.exe --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $doc.schema -ne 'canfit.snapshot') { throw "canfit --json failed" }
          Write-Output "available: $($doc.memory.available_bytes) of $($doc.memory.total_bytes) bytes; apps: $($doc.app_groups.Count)"
          target\release\canfit.exe
          if ($LASTEXITCODE -ne 0) { throw "canfit (one-shot) failed" }
          target\release\canfit.exe free
          if ($LASTEXITCODE -ne 0) { throw "canfit free failed" }
          $env:CANFIT_DATA_DIR = "$env:RUNNER_TEMP\canfit-data"
          target\release\canfit.exe history
          if ($LASTEXITCODE -ne 0) { throw "canfit history failed" }
          target\release\canfit.exe models .
          if ($LASTEXITCODE -ne 0) { throw "canfit models failed" }

      - name: Upload the Windows binary for VM testing
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: canfit-windows-x86_64
          path: target/release/canfit.exe
          retention-days: 14

  # Lints every workflow, including the generated release.yml. Shell snippets are not run through
  # shellcheck: release.yml is generated by cargo-dist and not edited by hand.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color -shellcheck=

  # Linux release binaries: fully static musl builds that run on any distribution (ADR-017).
  linux-musl:
    name: musl (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: canfit-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            artifact: canfit-linux-aarch64
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      # The history database bundles SQLite's C source (ADR-018): compile it against musl.
      - name: Install musl C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          target_env=$(echo "${{ matrix.target }}" | tr '-' '_')
          echo "CC_${target_env}=musl-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The whole suite again against musl: live /proc readings and real SIGTERM/SIGKILL closing.
      - name: Test (musl)
        run: cargo test --all-targets --all-features --locked --target ${{ matrix.target }}

      - name: Release build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Static binary, no dynamic dependencies
        run: |
          bin=target/${{ matrix.target }}/release/canfit
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie linked' || { echo "canfit is not static"; exit 1; }
          if ldd "$bin" 2>&1 | grep -q '=>'; then ldd "$bin"; echo "canfit has dynamic dependencies"; exit 1; fi
          ldd "$bin" 2>&1 || true

      - name: Smoke test
        run: |
          bin=target/${{ matrix.target }}/release/canfit
          "$bin" --json > snapshot.json
          python3 -c "import json; d=json.load(open('snapshot.json')); assert d['schema']=='canfit.snapshot' and d['platform']['os']=='linux', d; print('available', d['memory']['available_bytes'], 'of', d['memory']['total_bytes'], 'bytes; apps', len(d['app_groups']), '; PSI', d['stall'] and d['stall']['source'])"
          "$bin"
          "$bin" free
          CANFIT_DATA_DIR="$RUNNER_TEMP/canfit-data" "$bin" history
          "$bin" models .
          free -b
          cat /proc/pressure/memory || true

      - name: Upload the Linux binary for VM testing
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/canfit
          retention-days: 14
